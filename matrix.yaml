changelog_v22:
- Corrected YAML structure and added schema validation tooling.
- Rebuilt source citation registry from the actual DOCX headings and recorded document
  SHA-256 values.
- 'Moved checklist-derived citations to exact [M1 §28 #n] and [1.2 §5 #n] forms.'
- Classified coverage, mutation, pip-audit, CI and freeze-hash controls as REVIEW/DECISION
  requirements rather than claiming they originate in the 1.2 checklist.
- Made cooldown global across the two allowed hosts as a conservative project decision;
  documented directory-local sharing.
- Restored server-time failure, empty-effective-range, input validation, service allowlist,
  CLI error/exit-code, max-candle, failure-audit, CAST-AS-REAL and gate-negative-test
  rows.
- Resolved timeout/fallback and Retry-After/jitter contradictions and specified exact
  retry/backoff/sleep-budget values.
- Specified deterministic hash serialization and added a golden-vector requirement.
- Strengthened OBS-01/OBS-02 sampling and made OBS-02 reviewer approval a prerequisite
  to live acceptance.
- Expanded coverage scope to all src/trading_app modules and added JUnit/JSON coverage
  outputs.
- Corrected tripwire matching to HTTP-call regexes and kept scripts/download_candles.py
  as a thin wrapper.
- Added CI evidence as a separate mandatory gate from manual live evidence.
changelog_v23:
- Restored documentation, approval, R5/R6/R7, dependency, warning, tripwire, and final-boundary
  rows.
- Restored explicit pytest requirement-marker binding and valid nodeid syntax.
- Resolved Retry-After/sleep-budget and cooldown duration policy conflicts.
- Completed deterministic hash serialization and OBS-02 stability-lag definition.
- Moved source-of-truth documents to canonical Markdown with hashes and removed python-docx
  from validation.
- Tightened schema/validator and added required negative-test tooling rows.
changelog_v24:
- Replaced placeholder tests/acceptance bindings with real behavioral unit, integration,
  security, tooling, CI, observation, and live-test nodeids; bundled checklist facets
  use explicit parametrized IDs.
- 'Made traceability a real gate: acceptance rows may not bind to tests/acceptance;
  every mandatory row must have a collected, marker-bound, passing test in the executed
  JUnit evidence, and every M1 §28 / 1.2 §5 item must have at least one passing bound
  test.'
- Corrected RETRY-04 to a reachable 3s backoff cap and RETRY-05/COOLDOWN-02 to persist
  cooldown when the fetch sleep budget would be exceeded.
- Made cooldown trigger minimums explicit and consistent with the max(Retry-After,
  minimum) duration rule; renamed missing Retry-After behavior to use_exponential_backoff.
- Removed the obsolete circular OBS-02 pass field and made the stability-lag pass
  rule authoritative.
- Made skipped or xfailed mandatory tests unconditional gate failures; dependency-audit
  success and zero-known-vulnerability criteria are fail-closed.
- Restored explicit failure-audit write isolation, exactly-one successful server-time
  snapshot, and raise_for_status/userinfo logging coverage.
- Removed duplicate SCRIPT-01 and overlapping R6 rows, renamed the accepted-risks
  row, and corrected documentation/hygiene wording and artifacts.
risk_register:
  retry_after_budget_cooldown: A 31-60s Retry-After may cause a 600s cooldown because
    the 30s per-fetch sleep budget is fail-closed; this is an accepted conservative
    rate-limit risk.
  cooldown_scope: 'Cooldown state is directory-scoped: two separate checkouts on the
    same IP do not share the cooldown file; this is accepted because cross-checkout
    shared state would require an external shared state mechanism.'
evidence_classes:
  offline: local deterministic/unit/integration/security/tooling evidence; no network
    dependency
  ci: clean-install, Python-version, dependency-audit and CI artifact evidence
  live: real Binance public-data and time-dependent observation evidence
changelog_v25:
- Replaced row-level checklist coverage with explicit per-source-item behavioral node
  bindings and exact JUnit nodeid reconciliation, including parametrized IDs.
- Added runtime traceability support for multiple evidence-class JUnit artifacts (offline,
