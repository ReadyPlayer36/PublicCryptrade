schema_version: '2.9'
status:
  milestone_1: BLOCKED
  milestone_1_2: SPECIFICATION_NOT_FROZEN
stage_definition: Per-row stage 1 means the row is evaluated with Stage-1 tooling/evidence;
  stage 2 means the row additionally requires Stage-2 implementation/coverage/mutation/freeze
  tooling. The final gate evaluates every mandatory row regardless of this field.
documents:
  M1:
    path: docs/source/milestone_1.md
    sha256: 77042708f24696d548b99a7e8182fca9efc90cd6c3110814e2a15b2be78581b7
    format: markdown
    sections:
      '1': Project structure
      '2': pyproject.toml
      '3': .env.example
      '4': .gitignore
      '5': src/trading_app/__init__.py
      '6': src/trading_app/config.py
      '7': src/trading_app/data/__init__.py
      '8': src/trading_app/data/schemas.py
      '9': src/trading_app/data/models.py
      '10': src/trading_app/data/validator.py
      '11': src/trading_app/data/repository.py
      '12': src/trading_app/data/binance_client.py
      '13': src/trading_app/data/service.py
      '14': tests/fixtures/__init__.py
      '15': tests/unit/test_validator.py
      '16': tests/unit/test_repository.py
      '17': tests/unit/test_binance_client.py
      '18': scripts/download_candles.py
      '19': Installation
      '20': Run the tests
      '21': Test the real public-data path
      '22': Verify SQLite data
      '23': Verify timestamp continuity
      '24': Verify OHLC correctness
      '25': Verify invalid-volume handling
      '26': Verify suspicious data is not silently repaired
      '27': 'Design note: decimal preservation'
      '28': Milestone 1 acceptance checklist
    comparison: tools/compare_source_markdown.py compares the canonical Markdown against
      the reviewer-supplied Project Markdown copy using normalized headings, checklist
      items, and tables.
  M1_2:
    path: docs/source/milestone_1_2.md
    sha256: ceefb6e3f19e8a3499cdb7ab9322853e4edb6892e2e23bf85d1d9b198fd25eea
    format: markdown
    sections:
      '1': Purpose
      '2': Current approval status
      '3': Scope constraints
      '4': Mandatory code changes
      '5': Required regression tests
      '6': Metadata and audit-trail requirements
      '7': Unchanged/previously identified items to verify
      '8': Required source evidence
      '9': Clean-environment verification
      '10': Required live Binance evidence
      '11': Official Binance documentation evidence
      '12': Required answers
      '13': Final acceptance gate
      '14': Expected disposition after successful evidence
    comparison: tools/compare_source_markdown.py compares the canonical Markdown against
      the reviewer-supplied Project Markdown copy using normalized headings, checklist
      items, and tables.
source_citation_policy:
  valid_forms:
  - '[M1 §n]'
  - '[M1 §28 #n]'
  - '[1.2 §n]'
  - '[1.2 §5 #n]'
  - '[REVIEW]'
  - '[DECISION]'
  - '[SECURITY]'
  - '[EVIDENCE]'
  - '[OBSERVED]'
  - '[BINANCE]'
  rule: 'M1 §28 #n and 1.2 §5 #n resolve against recorded numbered checklist items;
    section-only citations resolve against generated heading registry; review/decision
    labels require no source heading.'
  labels_allowed:
  - '[M1]'
  - '[1.2]'
  - '[REVIEW]'
  - '[DECISION]'
  - '[SECURITY]'
  - '[EVIDENCE]'
  - '[OBSERVED]'
  - '[BINANCE]'
  test_binding: 'Each acceptance row names one or more real behavioral pytest nodeids
    under tests/unit, tests/integration, tests/security, tests/tools, tests/observations,
    tests/live, tests/ci, or tests/mutation; tests/acceptance is forbidden. Every
    bound test must carry @pytest.mark.requirement("ROW-ID"); a test may carry multiple
    requirement markers. Parametrized facets use explicit IDs. tools/check_traceability.py
    collects with pytest --collect-only --strict-markers and verifies JUnit results:
    every mandatory row must have at least one collected marker-bound test that passed,
    with no skipped/xfail mandatory test; every M1 §28 and 1.2 §5 item must have at
    least one passing bound test.'
network:
  hosts:
    primary: data-api.binance.vision
    fallback: api.binance.com
    excluded:
    - api1.binance.com
    - api2.binance.com
    - api3.binance.com
    - api4.binance.com
    - api-gcp.binance.com
    - testnet.binance.vision
    - demo-api.binance.com
  paths:
  - /api/v3/time
  - /api/v3/klines
  exact_match: true
  https_only: true
  follow_redirects: false
finality:
  S: server_time_ms
  L: configured_finality_lag_ms
  B: S-L
  rule: close_time_ms < B
  effective_end: min(requested_end, floor((S-L)/I)*I)
  local_clock_fallback: false
  lag_default: null
  lag_min_ms: 0
retry:
  attempts_total: 4
  retry_statuses:
  - 500
  - 502
  - 503
  - 504
  - 429
  retry_errors:
  - read_timeout
  - malformed_json_2xx
  non_retry_4xx: true
  connect_dns: fallback_only_before_first_successful_server_time
  read_timeout: same_host_retry
  backoff:
    base_seconds: 1
    factor: 2
    jitter_max_seconds: 1
    cap_seconds: 3
    formula: sleep = min(cap_seconds, base_seconds * factor^k) + jitter; jitter is
      applied only to exponential backoff and is bounded by jitter_max_seconds.
    jitter_applies_to: exponential_backoff_only
  retry_after:
    max_seconds: 60
    sleep_jitter: false
    over_cap: abort_and_persist_cooldown
    budget_exceeded: abort_and_persist_cooldown
    jitter: none
  sleep_budget_seconds: 30
  attempts_scope: per_request
  sleep_budget_scope: per_fetch
cooldown:
  scope: global_across_allowed_hosts
  path: data/binance_cooldown.json
  atomic_write: temp+fsync+os.replace
  triggers:
  - '418'
  - 429_exhausted
  - 429_retry_after_over_60
  - 429_retry_after_exceeds_sleep_budget
  durations:
    '418': max(supplied_retry_after,600)
    429_exhausted: max(supplied_retry_after,300)
    429_retry_after_over_60: max(supplied_retry_after,600)
    429_retry_after_exceeds_sleep_budget: max(supplied_retry_after,600)
  missing_retry_after: use_exponential_backoff
  directory_scoped: true
  duration_rule: For every 429/418 cooldown trigger, duration is max(supplied Retry-After
    when present, trigger minimum). 418 minimum=600s; exhausted 429 minimum=300s;
    Retry-After over 60s minimum=600s; Retry-After exceeding the 30s fetch sleep budget
    minimum=600s.
storage:
  begin_statement: BEGIN IMMEDIATE
  max_candles_per_fetch: 100000
  decimal_storage: format(d,"f")
  conflict_equality: numeric Decimal equality
  conflict_fields:
  - close_time
  - open
  - high
  - low
  - close
  - volume
  - quote_volume
  - trade_count
  created_at_excluded: true
hash:
  algorithm: SHA-256
  encoding: UTF-8
  field_separator_hex: 1f
  record_separator_hex: 0a
  trailing_record_separator: false
  field_order:
  - symbol
  - timeframe
  - open_time_ms
  - close_time_ms
  - open
  - high
  - low
  - close
  - volume
  - quote_volume
  - trade_count
  decimal_format: f
  record_order: open_time_ms ascending within the fetched symbol/timeframe range
  integer_serialization: ASCII decimal digits, base-10, no sign unless value is negative
  string_serialization: UTF-8 bytes of the exact string; ASCII characters are encoded
    as their single-byte ASCII values
  empty_set: hash the empty byte string; SHA-256 of empty input is e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
  golden_vector_required: true
  golden_vector_scope: empty set, one record, and multi-record set
coverage:
  scope: src/trading_app/**/*.py
  overall_branch_min: 85
  per_module_branch_min: 90
  exceptions: reviewer-approved only
  fail_closed: true
observations:
  OBS-01:
    status: open
    procedure: fixed historical candle; request endTime=C and C+1; startTime=O and
      O+1; retain raw responses and returned rows; update client convention if observation
      disagrees
  OBS-02:
    status: open
    minimum_samples:
    - '>=12 consecutive 5m boundaries'
    - '>=2 4h boundaries closing in the same observation window'
    offsets_seconds:
    - 0
    - 2
    - 10
    - 60
    compare:
    - open
    - high
    - low
    - close
    - volume
    - quote_volume
    - trade_count
    pass_rule: Observed finalization lag is the maximum observed time-to-stable across
      all required samples plus an explicit reviewer-approved safety margin; no hard-coded
      lag is accepted before observation.
    4h_sample_definition: At least 2 four-hour boundaries where 5m, 15m, 1h, and 4h
      candles all close together; sample all four interval types at each boundary.
  OBS-03:
    status: open
    depends_on:
    - OBS-02
    gate: reviewer approval before LIVE-* acceptance runs
