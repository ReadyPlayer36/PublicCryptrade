  tooling rejects _item_N bindings and trivially empty test bodies.
- Added the required L>0 finality facet and exact item-level behavioral bindings.
- Made canonical Markdown comparison normalize heading levels, bullets, bold markers,
  and table syntax, and compare against the Project source conversions.
- Added EVID-01 evidence-integrity gate for artifact existence, non-empty content,
  frozen commit identity, and SHA-256 manifest membership.
- Added portable tooling fixtures using tmp_path plus end-to-end pytest/JUnit runtime
  tests.
- Mapped all 16 required mutants to explicit killer nodeids.
- Documented the directory-scoped cooldown accepted risk.
- Added explicit tooling and mutation-gate rows for portable end-to-end traceability
  and named mutant killers.
