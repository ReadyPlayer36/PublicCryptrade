[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-spot-research"
version = "0.1.0.dev0"
description = "Public Binance Spot historical market-data research scaffold"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "PyYAML>=6,<7",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-cov>=5,<7",
  "coverage[toml]>=7.5,<8",
  "pip-audit>=2.7,<3",
  "jsonschema>=4.20,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["requirement(row_id): binds a behavioral test to a frozen acceptance-row ID"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["trading_app"]
