name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python312:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Confirm Python and pytest baseline
        run: python -c "import sys, pytest; print(sys.version); print('pytest', pytest.__version__); assert sys.version_info[:2] == (3, 12); assert pytest.__version__ == '9.1.1'"
      - name: Collect all tests
        run: python -m pytest --collect-only -q
      - name: Check frozen specification hashes
        run: python tools/check_freeze.py
      - name: Validate frozen matrix
        run: python tools/validate_matrix.py matrix.yaml --schema matrix_schema.json --m1 docs/source/milestone_1.md --m12 docs/source/milestone_1_2.md
      - name: Run specification/source checks (blocking)
        run: python tools/spec_check.py --project-m1 reviewer/project_source_m1.md --project-m12 reviewer/project_source_m1_2.md
      - name: Run expected-red behavior suite and export JUnit
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          python -m pytest -ra --junitxml=artifacts/junit-offline.xml 2>&1 | tee artifacts/pytest-output.txt
          pytest_rc=${PIPESTATUS[0]}
          python tools/red_reason_gate.py artifacts/junit-offline.xml --pytest-exit-code "$pytest_rc" --implementation-stage 2>&1 | tee artifacts/gate-output.txt
          gate_rc=${PIPESTATUS[0]}
          set -e
          {
            echo "### Expected-red gate (exit $gate_rc, pytest exit $pytest_rc)"
            echo '```'
            tail -n 40 artifacts/gate-output.txt
            echo '```'
            echo "<details><summary>pytest short summary</summary>"
            echo
            echo '```'
            grep -E "^(FAILED|ERROR)|passed|failed" artifacts/pytest-output.txt | tail -n 60
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$gate_rc"
      - name: Traceability audit (fails only on structural errors; acceptance remains BLOCKED)
        if: always() && hashFiles('artifacts/junit-offline.xml') != ''
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          python tools/check_traceability.py matrix.yaml --root . --junit offline=artifacts/junit-offline.xml --stage 2 > artifacts/check-traceability.txt 2>&1
          traceability_rc=$?
          set -e
          cat artifacts/check-traceability.txt
          set +e
          python tools/summarize_traceability.py artifacts/check-traceability.txt > artifacts/traceability-classes.txt
          structural_rc=$?
          set -e
          cat artifacts/traceability-classes.txt
          if [ "$traceability_rc" -eq 0 ]; then
            echo "### Traceability audit: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Traceability audit: BLOCKED" >> "$GITHUB_STEP_SUMMARY"
            { echo '```'; cat artifacts/traceability-classes.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            if [ "$structural_rc" -ne 0 ]; then
              echo "STRUCTURAL traceability errors present (markers/properties/bindings): this is a defect, not expected red." >> "$GITHUB_STEP_SUMMARY"
              exit 2
            fi
            echo "The full traceability gate is not satisfied. Review the traceability-audit artifact; expected-red production stubs and outstanding CI/live evidence may contribute. This diagnostic does not authorize implementation or acceptance." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
      - name: Upload offline JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-offline
          path: artifacts/junit-offline.xml
          if-no-files-found: error
      - name: Upload traceability audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traceability-audit
          path: |
            artifacts/check-traceability.txt
            artifacts/traceability-classes.txt
          if-no-files-found: warn
      - name: Concurrency stability and evidence (3 repeated runs; logs, JUnit and summary archived)
        if: always()
        shell: bash
        run: |
          set +e
          python tools/concurrency_evidence.py --runs 3 2>&1 | tee artifacts/concurrency-evidence-output.txt
          evidence_rc=${PIPESTATUS[0]}
          set -e
          {
            echo "### Concurrency evidence (exit $evidence_rc)"
            echo '```'
            cat artifacts/concurrency-evidence-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$evidence_rc"
      - name: Verify the main test run's concurrency evidence (overlap, scenarios, integrity)
        if: always()
        shell: bash
        run: |
          set +e
          python tools/concurrency_evidence.py --verify-only artifacts/concurrency-evidence 2>&1 | tee -a artifacts/concurrency-evidence-output.txt
          verify_rc=${PIPESTATUS[0]}
          set -e
          { echo "### Concurrency evidence of the main test run (exit $verify_rc)"; echo '```'; tail -n 20 artifacts/concurrency-evidence-output.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$verify_rc"
      - name: Upload concurrency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concurrency-evidence
          path: |
            artifacts/concurrency-evidence/
            artifacts/concurrency-evidence-output.txt
          if-no-files-found: error
      - name: Dependency audit (nonblocking until final gate)
        continue-on-error: true
        run: pip-audit
      - name: Hash-pinned constraints evidence status
        run: |
          if [ -f requirements-hashed.txt ]; then
            echo "Hash-pinned constraints file present; final verification remains required."
          else
            echo "BLOCKED: hash-pinned constraints evidence remains outstanding; Milestone 1 stays BLOCKED."
          fi

  probe-suite:
    name: Appendix A probe suite (native memory gate)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned interpreter (the probe values are interpreter-specific; A.1)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Verify the toolchain the gate depends on
        shell: bash
        run: |
          set -euo pipefail
          python -c "import sys; assert sys.version.split()[0] == '3.12.3', sys.version; print(sys.version)"
          command -v cc
          cc --version | head -n 1
          command -v openssl
          openssl version
          python -c "import ssl; print('OpenSSL for Python:', ssl.OPENSSL_VERSION)"
      - name: Build the interposer (warnings are errors; the gate needs both channels)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/probes
          cc -shared -fPIC -O2 -Wall -Wextra -Werror -o tools/obs/probes/alloc_peak.so tools/obs/probes/alloc_peak.c 2>&1 | tee artifacts/probes/build.log
          ls -l tools/obs/probes/alloc_peak.so | tee -a artifacts/probes/build.log
      - name: Pin the suite manifest (expected.json digests, recomputed)
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=$PWD python -m tools.obs.probes.run_all --manifest | tee artifacts/probes/manifest.json
      - name: "Prove the integrity refusals (negative cases: links, devices, substitutions)"
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=$PWD python -m tools.obs.probes.run_all --self-test 2>&1 | tee artifacts/probes/self-test.log

      - name: "Mutation: dropping -I, -S, narrowing the launcher or the guard call must FAIL the self-test (V25-01, V26-01)"
        shell: bash
        run: |
          set -euo pipefail
          pristine=artifacts/probes/probe_common.py.pristine
          cp tools/obs/probes/probe_common.py "$pristine"
          trap 'cp "$pristine" tools/obs/probes/probe_common.py' EXIT

          mutate() {
            local old="$1" new="$2" label="$3"
            cp "$pristine" tools/obs/probes/probe_common.py
            python3 -c 'import pathlib, sys; p = pathlib.Path("tools/obs/probes/probe_common.py"); t = p.read_text(encoding="utf-8"); old, new = sys.argv[1], sys.argv[2]; assert old in t, "mutation target missing: " + old; p.write_text(t.replace(old, new, 1), encoding="utf-8")' "$old" "$new"
            if PYTHONPATH=$PWD python -m tools.obs.probes.run_all --self-test > "artifacts/probes/mutation-${label}.log" 2>&1; then
              echo "MUTATION SURVIVED: ${label} did not fail the self-test" | tee -a artifacts/probes/mutation.log
              return 1
            fi
            printf '%s: killed — %s\n' "$label" "$(grep -E '^(PASS|FAIL):' "artifacts/probes/mutation-${label}.log" | tail -1)" | tee -a artifacts/probes/mutation.log
          }

          : > artifacts/probes/mutation.log
          mutate 'CHILD_FLAGS = ("-I", "-S")' 'CHILD_FLAGS = ("-I",)' no-I
          mutate 'CHILD_FLAGS = ("-I", "-S")' 'CHILD_FLAGS = ("-S",)' no-S
          mutate 'return [sys.executable, *CHILD_FLAGS, "-c", BOOTSTRAP]' 'return [sys.executable, "-I", "-c", BOOTSTRAP]' no-command-S
          mutate $'\nisolated()          # V25-01' $'\npass  # guard removed' no-guard
          echo "all four mutations killed: the self-test failed for each" | tee -a artifacts/probes/mutation.log

      - name: Run the probe gate (fails on any mismatch, modified file, addition or deletion)
        id: gate
        shell: bash
        run: |
          set +e
          PYTHONPATH=$PWD python -m tools.obs.probes.run_all --check --report artifacts/probes/report.json 2>&1 | tee artifacts/probes/gate.log
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "### Appendix A probe gate (exit $rc)"
            echo '```'
            cat artifacts/probes/gate.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: "Upload raw probe outputs (always: evidence outlives a red gate)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-suite-evidence
          path: |
            artifacts/probes/gate.log
            artifacts/probes/manifest.json
            artifacts/probes/report.json
            artifacts/probes/self-test.log
            artifacts/probes/mutation.log
            artifacts/probes/build.log
          if-no-files-found: error
      - name: Upload the built interposer alongside the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alloc-peak-so
          path: tools/obs/probes/alloc_peak.so
          if-no-files-found: warn
